[project]
name = "ventupilot"
version = "0.1.0"
description = "Agente conversacional de compra de productos por WhatsApp"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-ai>=2.31",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "asyncpg>=0.30",
    # Descifra el desafío del WAF de prisa.cl. Va en las dependencias base y no
    # en el extra `prisa` porque `desafio.py` se testea siempre; el navegador
    # es lo opcional, el AES no.
    "cryptography>=43",
]

[project.optional-dependencies]
# Login en prisa.cl. Es un extra porque arrastra un Chromium (~150 MB) que solo
# necesita quien vaya a entrar al portal, no el gateway ni el worker.
# Tras instalarlo: `uv run playwright install chromium`.
prisa = [
    "playwright>=1.48",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true

# asyncpg no publica py.typed. Se acota el ignore a ese módulo en lugar de
# desactivar la comprobación de imports globalmente.
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

# Playwright vive en el extra `prisa`, así que no está instalado en el entorno
# de CI ni en el de los servicios. El ignore se acota a ese módulo en lugar de
# aflojar la comprobación para todo el proyecto.
[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true
